<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">OmniGet Web architecture / 系统架构</title><desc id="desc">Sites serves the web workbench and Worker APIs. The Worker resolves links and streams files into the browser download manager.</desc>
