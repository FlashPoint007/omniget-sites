<rect width="1200" height="790" rx="26" fill="url(#bg)"/>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><text x="48" y="57" font-size="14" letter-spacing="3" fill="#387d86">OMNIGET WEB · SYSTEM MAP</text><text x="48" y="102" font-size="32" font-weight="700" fill="#183d51">粘贴链接，由浏览器接收文件</text><text x="48" y="134" font-size="18" fill="#55707d">Resolve on the site. Stream to the browser download manager.</text>
