<text x="72" y="707" fill="#fff" font-size="17" font-weight="700">Privacy boundary / 隐私边界</text><text x="72" y="733" fill="#d0e9e9" font-size="16">Links are sent to Sites for parsing. Files stream through the Worker to the browser.</text>
