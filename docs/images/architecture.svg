<g fill="#55707d" font-size="16"><text x="70" y="246">HTML · CSS · ES modules</text><text x="70" y="272">Web assets + Worker</text><text x="70" y="403">安装包与 SHA-256</text><text x="70" y="428">Installer metadata</text><text x="70" y="453">Fallback: releases.json</text><text x="374" y="248">app.mjs · UI &amp; task orchestration</text><text x="806" y="247">Public HTTP(S) files</text><text x="806" y="273">Page media + full video files</text><text x="806" y="302">源站权限 / Source access rules</text><text x="806" y="462">Resolve + signed download URL</text><text x="806" y="492">POST /api/resolve</text><text x="806" y="519">GET /api/download</text><text x="806" y="552">Attachment + Range forwarding</text><text x="806" y="589">流式转发 / Streaming transfer</text><text x="806" y="615">下载进度由浏览器管理</text></g>
