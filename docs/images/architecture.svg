<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">OmniGet Web architecture / 系统架构</title><desc id="desc">Sites serves static assets. Browser routes direct files to storage or hands media links to the local OmniGet desktop bridge. Releases come from GitHub with bundled fallback.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1f8ff"/><stop offset="1" stop-color="#eafaf6"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3c8292"/></marker></defs>
<rect width="1200" height="790" rx="26" fill="url(#bg)"/>
<g font-family="Arial, 'Noto Sans CJK SC', sans-serif"><text x="48" y="57" font-size="14" letter-spacing="3" fill="#387d86">OMNIGET WEB · SYSTEM MAP</text><text x="48" y="102" font-size="32" font-weight="700" fill="#183d51">静态网页，连接本机能力</text><text x="48" y="134" font-size="18" fill="#55707d">A static workbench. Downloads stay with your browser or desktop.</text>
<g fill="#fff" stroke="#c7dfe4" stroke-width="2"><rect x="48" y="178" width="250" height="118" rx="18"/><rect x="48" y="336" width="250" height="139" rx="18"/><rect x="350" y="178" width="370" height="460" rx="20" fill="#fff"/><rect x="782" y="178" width="370" height="154" rx="18"/><rect x="782" y="394" width="370" height="244" rx="18"/></g>
<g fill="#183d51" font-weight="700" font-size="22"><text x="70" y="216">Sites 静态托管</text><text x="70" y="372">GitHub Releases</text><text x="374" y="218">浏览器 / Browser</text><text x="806" y="216">文件源 / File origin</text><text x="806" y="432">OmniGet Desktop</text></g>
<g fill="#55707d" font-size="16"><text x="70" y="246">HTML · CSS · ES modules</text><text x="70" y="272">No application backend</text><text x="70" y="403">安装包与 SHA-256</text><text x="70" y="428">Installer metadata</text><text x="70" y="453">Fallback: releases.json</text><text x="374" y="248">app.mjs · UI &amp; task orchestration</text><text x="806" y="247">HTTP(S) / CORS</text><text x="806" y="273">Buffer ≤64 MiB or disk streaming</text><text x="806" y="302">浏览器保存 / Browser → disk</text><text x="806" y="462">127.0.0.1 · paired local bridge</text><text x="806" y="492">GET /v1/health · GET /v1/queue</text><text x="806" y="519">POST /v1/enqueue</text><text x="806" y="552">Fallback: omniget: URI</text><text x="806" y="589">媒体解析与下载 / Media downloads</text><text x="806" y="615">设置与插件由桌面端负责</text></g>
<g fill="#edf8f5"><rect x="374" y="280" width="322" height="74" rx="12"/><rect x="374" y="372" width="322" height="74" rx="12"/><rect x="374" y="464" width="322" height="74" rx="12"/><rect x="374" y="556" width="322" height="58" rx="12"/></g>
<g fill="#24596b" font-size="18" font-weight="700"><text x="392" y="310">links.mjs + detect.mjs</text><text x="392" y="402">download.mjs</text><text x="392" y="494">bridge.mjs</text><text x="392" y="591">sessionStorage · 当前会话队列</text></g>
<g fill="#55707d" font-size="15"><text x="392" y="336">Parse · deduplicate · route</text><text x="392" y="428">Direct files · cancel · progress</text><text x="392" y="520">Local pairing · enqueue · poll</text></g>
<g fill="none" stroke="#3c8292" stroke-width="2.5" marker-end="url(#arrow)"><path d="M298 238H343"/><path d="M298 405H343"/><path d="M720 408H748V265H775"/><path d="M720 502H775"/></g>
<rect x="48" y="678" width="1104" height="70" rx="16" fill="#173f51"/>
<text x="72" y="707" fill="#fff" font-size="17" font-weight="700">Privacy boundary / 隐私边界</text><text x="72" y="733" fill="#d0e9e9" font-size="16">Pairing token: page memory only. Media URLs and desktop tokens do not pass through a Sites backend.</text>
</g></svg>